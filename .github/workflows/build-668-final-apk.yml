name: Build 668 Final Diagnostic APK
on:
  push:
    branches:
      - build/668-final-apk-20261022
    paths:
      - BIST-VIOP-V6.3.38-BUILD668-FINAL-SOURCE.zip
      - .github/workflows/build-668-final-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact Build 668 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source=Path("BIST-VIOP-V6.3.38-BUILD668-FINAL-SOURCE.zip")
          with ZipFile(source) as z:
              invalid=z.testzip()
              assert invalid is None, f"Invalid ZIP member: {invalid}"
              for member in z.namelist():
                  p=Path(member)
                  assert not p.is_absolute() and ".." not in p.parts, member
              z.extractall("source")
          assert (Path("source")/"android-v6323"/"gradlew").is_file()
          print("Exact checked-in archive extracted.")
          PY
      - name: Apply Android XML compiler correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("source/android-v6323/app/src/main/res/layout")
          paths=[root/"activity_stock_detail.xml",root/"include_stock_detail_extended_metrics.xml"]
          for path in paths:
              before=path.read_text()
              assert 'horizontalScrollBarEnabled="false"' in before, path
              path.write_text(before.replace('horizontalScrollBarEnabled="false"','scrollbars="none"'))
              print("Fixed AAPT2 invalid attribute in",path)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-none}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Build 668 diagnostic APK
        working-directory: source/android-v6323
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          bash ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' :app:assembleDiagnostic --stacktrace 2>&1 | tee ../../gradle-build.log
      - name: Run Android unit tests
        working-directory: source/android-v6323
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --max-workers=2 :app:testDiagnosticUnitTest --stacktrace 2>&1 | tee ../../gradle-unit-tests.log
      - name: Android lint
        working-directory: source/android-v6323
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --max-workers=2 :app:lintDiagnostic --stacktrace 2>&1 | tee ../../gradle-lint.log
      - name: Verify APK content, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find source/android-v6323/app/build/outputs/apk/diagnostic -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" | tail -2
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\\.dex$'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='668'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='6.3.38'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          mkdir -p output
          cp "$APK" output/BIST-VIOP-V6.3.38-BUILD668-DIAGNOSTIC.apk
      - name: Upload verified APK and metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.3.38-BUILD668-DIAGNOSTIC
          path: |
            output/BIST-VIOP-V6.3.38-BUILD668-DIAGNOSTIC.apk
            apk-sha256.txt
            apk-signature.txt
          if-no-files-found: error
      - name: Upload error logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build668-CI-Diagnostics
          path: |
            gradle-build.log
            gradle-unit-tests.log
            gradle-lint.log
            source/android-v6323/app/build/test-results/**
            source/android-v6323/app/build/reports/lint-results-*
          if-no-files-found: warn
