name: Build 668 Final Diagnostic APK
on:
  push:
    branches:
      - build/668-verified-apk-source-fix-20261022
    paths:
      - BIST-VIOP-V6.3.38-BUILD668-FINAL-SOURCE.zip
      - .github/workflows/build-668-final-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact Build 668 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source=Path("BIST-VIOP-V6.3.38-BUILD668-FINAL-SOURCE.zip")
          with ZipFile(source) as z:
              invalid=z.testzip()
              assert invalid is None, f"Invalid ZIP member: {invalid}"
              for member in z.namelist():
                  p=Path(member)
                  assert not p.is_absolute() and ".." not in p.parts, member
              z.extractall("source")
          assert (Path("source")/"android-v6323"/"gradlew").is_file()
          print("Exact checked-in archive extracted.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Install command-line tools instead of assuming a runner-specific sdkmanager path.
      - name: Set up Android SDK 35 and build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK availability
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          echo "Android SDK platform 35 and build-tools 35.0.0 ready."
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Build 668 diagnostic APK
        working-directory: source/android-v6323
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          set +e
          bash ./gradlew --no-daemon --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' :app:assembleDiagnostic --stacktrace 2>&1 | tee ../../gradle-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "::group::BUILD 668 - FIRST COMPILATION ERRORS"
            python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path("../../gradle-build.log").read_text(errors="replace").splitlines()
          pats=[
              r"^> Task .* FAILED",
              r"(^|\s)(error:|AAPT: error:|e: )",
              r"^\* What went wrong:",
              r"^Execution failed for task",
              r"^> .*",
              r"^Caused by:",
          ]
          hits=[i for i,line in enumerate(lines) if any(re.search(p,line) for p in pats)]
          chosen=[]
          for i in hits[:30]:
              for j in range(max(0,i-1), min(len(lines),i+3)):
                  if j not in chosen:
                      chosen.append(j)
          print("FAILED GRADLE OUTPUT: showing root-cause candidates, not just last stack frames")
          if chosen:
              for j in sorted(chosen)[:100]:
                  print(f"{j+1}: {lines[j]}")
          else:
              print("\n".join(lines[-70:]))
          PY
            echo "::endgroup::"
            echo "::error::Build 668 diagnostic Gradle assemble failed; see FIRST COMPILATION ERRORS above and Build668-CI-Diagnostics artifact."
            {
              echo "### Build 668 failed"
              echo 'The diagnostic APK was not generated. See the BUILD 668 - FIRST COMPILATION ERRORS group and gradle-build.log artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Run Android unit tests
        working-directory: source/android-v6323
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --max-workers=2 :app:testDiagnosticUnitTest --stacktrace 2>&1 | tee ../../gradle-unit-tests.log
      - name: Android lint
        working-directory: source/android-v6323
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --max-workers=2 :app:lintDiagnostic --stacktrace 2>&1 | tee ../../gradle-lint.log
      - name: Verify APK content, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find source/android-v6323/app/build/outputs/apk/diagnostic -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" | tail -2
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\.dex$'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='668'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='6.3.38'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          mkdir -p output
          cp "$APK" output/BIST-VIOP-V6.3.38-BUILD668-DIAGNOSTIC.apk
      - name: Upload verified APK and metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.3.38-BUILD668-DIAGNOSTIC
          path: |
            output/BIST-VIOP-V6.3.38-BUILD668-DIAGNOSTIC.apk
            apk-sha256.txt
            apk-signature.txt
          if-no-files-found: error
      - name: Upload error logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build668-CI-Diagnostics
          path: |
            gradle-build.log
            gradle-unit-tests.log
            gradle-lint.log
            source/android-v6323/app/build/test-results/**
            source/android-v6323/app/build/reports/lint-results-*
          if-no-files-found: warn
