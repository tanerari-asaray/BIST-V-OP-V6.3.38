name: Build Android APK (Build 668)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract uploaded source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q BIST-VIOP-V6.3.38-BUILD668-KAYNAK-PAKETI.zip -d source
          echo "Extracted source package:"
          find source -maxdepth 3 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Locate Gradle project and build APK
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew found in the uploaded source ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "Gradle project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-Build668-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
