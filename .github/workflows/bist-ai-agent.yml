name: BIST VIOP AI Agent (diagnostic)
on:
  push:
    branches:
      - automation/openai-agent-20261024
    paths:
      - '.github/workflows/bist-ai-agent.yml'
      - '.github/scripts/bist_ai_agent.py'
  workflow_dispatch:
  schedule:
    - cron: '0 5,8,11,14,17 * * *'
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is missing"
            exit 1
          fi
      - name: Validate Python agent syntax
        run: python3 -m py_compile .github/scripts/bist_ai_agent.py
      - name: Analyze latest Android build failures with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/bist_ai_agent.py
