name: BIST VIOP Build 668 APK
on:
  push:
    paths:
      - 'source/build668.zip'
      - '.github/workflows/build-668-from-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source archive
        run: |
          test -s source/build668.zip || { echo "::error::Upload source/build668.zip before running"; exit 1; }
          unzip -t source/build668.zip | tail -n 2
          mkdir -p extracted
          unzip -q source/build668.zip -d extracted
          test -f extracted/android-v6323/gradlew
          test -f extracted/android-v6323/gradle/wrapper/gradle-wrapper.jar
      - name: Build and test
        working-directory: extracted/android-v6323
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:compileDiagnosticKotlin :app:testDiagnosticUnitTest :app:lintDiagnostic :app:assembleDiagnostic
      - name: Validate APK
        run: |
          find extracted/android-v6323/app/build/outputs/apk/diagnostic -name '*.apk' -type f -size +0c -print -exec unzip -t {} \; -exec sha256sum {} \;
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-BUILD668-APK-AND-REPORTS
          path: |
            extracted/android-v6323/app/build/outputs/apk/diagnostic/*.apk
            extracted/android-v6323/app/build/reports/**
            extracted/android-v6323/app/build/test-results/**
          if-no-files-found: warn
